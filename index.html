<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Website</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
        color: #333;
      }

      header {
        background-color: #222;
        color: white;
        padding: 20px;
        text-align: center;
      }

      nav {
        background-color: #444;
        padding: 12px;
        text-align: center;
      }

      nav a {
        color: white;
        text-decoration: none;
        margin: 0 15px;
      }

      nav a:hover {
        color: orange;
      }

      main {
        max-width: 900px;
        margin: 40px auto;
        padding: 20px;
      }

      section {
        background: white;
        padding: 25px;
        margin-bottom: 20px;
        border-radius: 8px;
      }

      button {
        background-color: #222;
        color: white;
        border: none;
        padding: 10px 20px;
        margin-top: 15px;
        cursor: pointer;
        border-radius: 5px;
      }

      button:hover {
        background-color: #555;
      }

      footer {
        background-color: #222;
        color: white;
        text-align: center;
        padding: 15px;
        margin-top: 30px;
      }
    </style>
  </head>

  <body>
    <header>
      <h1>Welcome to My Website</h1>
      <p>A simple HTML webpage</p>
    </header>

    <nav>
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>

    <main>
      <section id="home">
        <h2>Home</h2>
        <p>Welcome! This is my first webpage.</p>
        <button onclick="showMessage()">Click Me</button>
        <p id="message"></p>
      </section>

      <section id="about">
        <h2>About</h2>
        <p>This section contains information about the website.</p>
      </section>

      <section id="contact">
        <h2>Contact</h2>
        <p>Email: example@gmail.com</p>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 My Website. All rights reserved.</p>
    </footer>

    <script>
      function showMessage() {
        document.getElementById("message").innerHTML =
          "Hello! Welcome to my website.";
      }
    </script>
  </body>
</html>
